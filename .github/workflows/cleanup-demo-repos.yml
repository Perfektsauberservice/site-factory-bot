name: Cleanup Demo Repos

on:
  schedule:
    - cron: '0 3 * * *'  # In fiecare zi la 3:00 AM
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete demo repos older than 1 day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: |
          echo "Caut repo-uri demo..."
          gh repo list Perfektsauberservice --limit 200 --json name,createdAt \
            --jq '.[] | select(.name | startswith("demo-")) | [.name, .createdAt] | @tsv' \
          | while IFS=$'\t' read -r name createdAt; do
              created=$(date -d "$createdAt" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$createdAt" +%s)
              now=$(date +%s)
              age=$(( (now - created) / 3600 ))
              if [ "$age" -ge 24 ]; then
                echo "Sterg: $name (varsta: ${age}h)"
                gh repo delete "Perfektsauberservice/$name" --yes
              else
                echo "Pastrez: $name (varsta: ${age}h, prea nou)"
              fi
            done
          echo "Gata!"
